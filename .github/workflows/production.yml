name: Production readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Build and validate application and server
        run: |
          npm run build
          npm run check
          node scripts/check-server.mjs
      - name: Install cross-browser tooling
        run: |
          npm install --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser release verification
        run: |
          npm run dev > /tmp/pixel-passport-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/healthz >/dev/null; then break; fi
            sleep 1
          done
          npm run test:release
      - name: Build deployment image
        run: docker build -t pixelpassport:review .
      - name: Smoke-test non-root deployment image
        run: |
          docker run -d --name pp-release -p 4180:4173 pixelpassport:review
          trap 'docker logs pp-release; docker rm -f pp-release' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4180/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4180/healthz
          curl -fsS http://127.0.0.1:4180/launch.js >/dev/null
          test "$(docker exec pp-release id -u)" != "0"
      - name: Package validated release candidate
        run: |
          mkdir -p release
          git rev-parse HEAD > release/COMMIT.txt
          tar -czf release/pixelpassport-release.tar.gz dist server.mjs security-headers.mjs package.json Dockerfile docs/deployment.md
          sha256sum release/pixelpassport-release.tar.gz > release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-verification
          path: artifacts/release*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-release-candidate
          path: release/
          retention-days: 14
