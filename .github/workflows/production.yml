name: Production readiness
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Retain exact reviewed source for release diagnosis
        run: |
          mkdir -p /tmp/pixelpassport-source
          git archive --format=tar.gz HEAD > /tmp/pixelpassport-source/source.tar.gz
          git rev-parse HEAD > /tmp/pixelpassport-source/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-source
          path: /tmp/pixelpassport-source/
          retention-days: 2
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=high
      - name: Build and validate application
        run: |
          npm run build
          npm run check
